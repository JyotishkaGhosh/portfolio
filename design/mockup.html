<script>
/* ---------- voxel cube generator ---------- */
function shade(hex, f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*f)));g=Math.max(0,Math.min(255,Math.round(g*f)));b=Math.max(0,Math.min(255,Math.round(b*f)));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
// affine map from unit square (u,v) to parallelogram p0 (top-left), p1 (top-right), p3 (bottom-left)
function face(p0,p1,p3,N,colorFn){let s='';
  const ex=[(p1[0]-p0[0])/N,(p1[1]-p0[1])/N], ey=[(p3[0]-p0[0])/N,(p3[1]-p0[1])/N];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const a=[p0[0]+ex[0]*i+ey[0]*j,p0[1]+ex[1]*i+ey[1]*j];
    const pts=[a,[a[0]+ex[0],a[1]+ex[1]],[a[0]+ex[0]+ey[0],a[1]+ex[1]+ey[1]],[a[0]+ey[0],a[1]+ey[1]]];
    s+=`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' ')}" fill="${colorFn(i,j)}" stroke="${colorFn(i,j)}" stroke-width=".6"/>`;}
  return s}
// sprites: 8x8, chars map to palette keys
const SPR={
 heart:["........",".##..##.","#oo##oo#","#oooooo#","#oooooo#",".#oooo#.","..#oo#..","...##..."],
 chart:["........","......#.",".....##.","..#..##.",".##.###.",".##.###.",".######.","########"],
 search:["..####..",".#oooo#.","#oo..oo#","#o....o#","#oo..oo#",".#oooo##","..####.##","......##"],
 plane:["...##...","...##...","..####..","########","###oo###","...##...","..####..",".##..##."],
 star:["...##...","...##...","#######.",".#####..","..####..",".##..##.","##....##","........"],
 trophy:["########","#oooooo#",".#oooo#.","..#oo#..","...##...","...##...","..####..",".######."],
 scroll:[".######.","#oooooo#",".#.##.#.",".#oooo#.",".#.##.#.",".#oooo#.","#oooooo#",".######."],
 mail:["........","########","##oooo##","#o#oo#o#","#oo##oo#","#oooooo#","########","........"],
 brief:["..####..","..#..#..","########","#oooooo#","########","#oo##oo#","#oooooo#","########"],
 folder:["........","###.....","#oo#####","#oooooo#","########","#oooooo#","#oooooo#","########"],
 grad:["........","...##...",".######.","########",".######.","..#oo#..","..#oo#.#",".......#"],
};
function cube(size,{top,side,mark='#3a0d2b',mark2='#fff6fa',sprite,grass=false}){
  const w=size,h=size, cx=w/2;
  const T=[[cx,0],[w,h/4],[cx,h/2],[0,h/4]];
  const N=8;
  const tex=(base,f)=>(i,j)=>shade(base,f*(0.9+rnd()*0.2));
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  // top
  s+=face(T[0],T[1],T[3],N,tex(top,1.06));
  // left face: p0=(0,h/4) p1=(cx,h/2) p3=(0,3h/4)
  const L0=[0,h/4],L1=[cx,h/2],L3=[0,3*h/4];
  const R0=[cx,h/2],R1=[w,h/4],R3=[cx,h];
  const sp=sprite?SPR[sprite]:null;
  const leftFn=(i,j)=>{
    if(grass&&j<2) return shade(top,0.88*(0.9+rnd()*0.2));
    if(sp&&sp[j]&&sp[j][i]==='#') return mark;
    if(sp&&sp[j]&&sp[j][i]==='o') return mark2;
    return shade(side,0.86*(0.9+rnd()*0.2));};
  s+=face(L0,L1,L3,N,leftFn);
  s+=face(R0,R1,R3,N,(i,j)=>grass&&j<2?shade(top,0.7*(0.9+rnd()*0.2)):shade(side,0.66*(0.9+rnd()*0.2)));
  // edges
  s+=`<polygon points="${[T[0],T[1],[w,3*h/4],[cx,h],[0,3*h/4],T[3]].map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3a0d2b" stroke-width="3" stroke-linejoin="miter"/>`;
  s+=`<polyline points="${[T[3],T[2],T[1]].map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3a0d2b" stroke-opacity=".35" stroke-width="2"/>`;
  s+=`<line x1="${cx}" y1="${h/2}" x2="${cx}" y2="${h}" stroke="#3a0d2b" stroke-opacity=".35" stroke-width="2"/>`;
  return s+'</svg>';}

function sky(W,H){

  // pixel sun
  s+=`<div style="position:absolute;right:${W*0.2}px;top:70px;width:96px;height:96px;background:#fff3c4;box-shadow:0 0 0 12px rgba(255,243,196,.45),0 0 0 28px rgba(255,243,196,.2)"></div>`;
  // blocky clouds
  const clouds=[[80,60,1],[W*0.42,110,.8],[W*0.68,40,1.1],[W*0.86,170,.7],[W*0.25,190,.6]];
  clouds.forEach(([x,y,sc])=>{const u=16*sc;
    s+=`<div style="position:absolute;left:${x}px;top:${y}px">
      <div style="position:absolute;left:${u*2}px;top:0;width:${u*5}px;height:${u*2}px;background:#fff"></div>
      <div style="position:absolute;left:0;top:${u*2}px;width:${u*10}px;height:${u*2}px;background:#fff"></div>
      <div style="position:absolute;left:${u}px;top:${u*4}px;width:${u*8}px;height:${u}px;background:#ffe8f2"></div></div>`});
  return s;}
function land(W,H,base){
  let s='';const B=32;
  // hills of blocks
  for(let x=0;x<W;x+=B){
    const hgt=Math.round(3+2*Math.sin(x/170)+1.5*Math.sin(x/61)+ (x%7));
    const n=Math.max(2,Math.min(7,hgt));
    for(let k=0;k<n;k++){
      const y=base-(k+1)*B;
      const isTop=k===n-1;
      const c=isTop?shade('#ff9fcf',0.92+((x/B+k)%3)*0.05):shade(k<2?'#b8638f':'#d97aa9',0.9+((x/B*3+k)%4)*0.04);
      s+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${B}px;height:${B}px;background:${c};box-shadow:inset -3px -3px 0 rgba(58,13,43,.18),inset 3px 3px 0 rgba(255,255,255,.18)"></div>`;
    }
    if(isTree(x)){ // cherry blossom tree
      const top=base-(n)*B;
      for(let k=1;k<=3;k++) s+=`<div style="position:absolute;left:${x}px;top:${top-k*B}px;width:${B}px;height:${B}px;background:#7a3b55;box-shadow:inset -3px 0 0 #5c2a40"></div>`;
      for(let dx=-2;dx<=2;dx++)for(let dy=0;dy<3;dy++){ if(Math.abs(dx)===2&&dy!==1)continue;
        s+=`<div style="position:absolute;left:${x+dx*B}px;top:${top-(4+dy)*B}px;width:${B}px;height:${B}px;background:${['#ffb6d9','#ff9fcf','#ffd1e6'][(dx+dy+5)%3]};box-shadow:inset -3px -3px 0 rgba(200,60,120,.25)"></div>`}
    }
  }
  s+=`<div style="position:absolute;left:0;top:${base}px;width:${W}px;height:${H-base}px;background:#a24f7a"></div>`;
  return s;}
function isTree(x){return [224,736,1184].includes(x)||[96,320].includes(x)&&false}
function hotbar(W,y,scale=1){
  const slots=[...DESK.slice(0,2),...PROJ,...DESK.slice(5,7),DESK[2]].slice(0,9);const sz=56*scale;
  let s=`<div style="position:absolute;left:${(W-(sz+6)*9-110)/2}px;top:${y}px;display:flex;align-items:center;gap:10px">`;

  slots.forEach((b,i)=>{s+=`<div class="slot" style="width:${sz}px;height:${sz}px;display:grid;place-items:center;${i===1?'box-shadow:0 0 0 4px #fff, inset 4px 4px 0 #d98fb2':''}">${cube(sz*0.7,b)}</div>`});
  s+=`</div></div>`;return s;}
